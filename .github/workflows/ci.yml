name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hubline
          POSTGRES_PASSWORD: hubline
          POSTGRES_DB: hubline_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hubline -d hubline_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hubline:hubline@localhost:5433/hubline_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    # Same commands as locally.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # build-time placeholders only (auth.ts validates these at import); never real secrets
      DASHBOARD_PASSWORD: ci-placeholder-password-0123456789
      AUTH_SECRET: ci-placeholder-auth-secret-0123456789
      AUTH_PROVIDERS: password
      BACKEND_URL: http://127.0.0.1:8000
      BACKEND_API_TOKEN: ci-placeholder-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
