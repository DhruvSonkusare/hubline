# Free cron for Render Free (plan R9): wakes the backend and runs one scheduler pass + agent drain.
# Inert until the repository secrets TICK_URL and TICK_SECRET exist (Settings -> Secrets -> Actions):
#   TICK_URL    = https://<service>.onrender.com/internal/tick?wait=true
#   TICK_SECRET = same value as the backend's TICK_SECRET env var
# GitHub may delay scheduled runs, and disables schedules after 60 days without repo activity.
name: Tick backend

on:
  schedule:
    - cron: "*/30 1-17 * * *" # every 30 min, 01:00-17:30 UTC = 06:30-23:00 IST (36 runs/day)
  workflow_dispatch: {}

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /internal/tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "TICK_URL / TICK_SECRET not configured; skipping."
            exit 0
          fi
          # Render Free needs ~1 min to wake; the tick itself drains for at most 60 s.
          curl --fail-with-body --silent --show-error \
               --retry 3 --retry-delay 20 --retry-all-errors --max-time 150 \
               -X POST -H "X-Tick-Secret: $TICK_SECRET" "$TICK_URL"
          echo
