# Local development + test database. Production uses Neon (see docs/setup/deploy.md).
services:
  db:
    image: postgres:16-alpine
    container_name: hubline-db
    environment:
      POSTGRES_USER: hubline
      POSTGRES_PASSWORD: hubline
      POSTGRES_DB: hubline
    ports:
      - "5433:5432" # 5433 avoids clashing with a locally installed Postgres
    volumes:
      - hubline-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubline -d hubline"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  hubline-db:
